plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.lexicon.kubkod125'
    compileSdk 34

    defaultConfig {
        applicationId "ru.lexicon.kubkod125"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0-KUBKOD"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
