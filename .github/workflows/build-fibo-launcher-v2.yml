name: Build CUBE-125 Fibo Launcher V2 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fibo_launcher_v2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android Project & Inject Phone/Contacts Permissions
        run: |
          npm install
          npx cap add android
          npx cap sync android
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<\/manifest>/<uses-permission android:name="android.permission.READ_CONTACTS"\/><uses-permission android:name="android.permission.WRITE_CONTACTS"\/><uses-permission android:name="android.permission.CALL_PHONE"\/><\/manifest>/' "$MANIFEST"
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../CUBE125-Fibo-Launcher-v2.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CUBE125-Fibo-Launcher-v2-APK
          path: fibo_launcher_v2/CUBE125-Fibo-Launcher-v2.apk

      - name: Publish Ready APK to GitHub Releases (Direct Download)
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: v2.0-fibo
          name: "КУБ-125 Фибо-Лаунчер №2 (Готовый APK)"
          files: fibo_launcher_v2/CUBE125-Fibo-Launcher-v2.apk
